<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Concept</title>
    <link rel="icon" href="./img/icon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Viga&display=swap" rel="stylesheet">

</head>
<body>
    <div class="background"></div>

    <main>

        <div class="player">
            <img id="cover" class="album-cover" alt="Capa do Álbum">
            <h1 id="title"></h1>
            <h5 id="artist"></h5>
            <audio id="music">
                <source id="song" type="audio/mpeg">
            </audio>

            <div class="container-barra">
                <div id="barra-prog"></div>
            </div>

            <div class="controls">
                <button id="prev" class="btn-player">⏮</button>
                <button id="pause" class="btn-player">▶</button>
                <button id="next" class="btn-player">⏭</button>

                <div class="volume">
                    <input 
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                    >
                </div>
            </div>

        </div>

        <div class="story">
            <h1  id="year" class="year"></h1>
            <p  id="story"></p>
        </div>

    </main>

    <footer>Desenvolvido por <a href="https://github.com/Bless-Developer" target="_blank" rel="noopener noreferrer">Cassandra Oliveira</a>. Musicas e obras pertencem aos seus respectivos criadores.</footer>

<script src="script.js"></script>
</body>
</html>
