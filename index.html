<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Player Concept</title>
    <link rel="icon" href="./img/page-icon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Viga&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        <div class="player">
            <img src="./img/human.jpg" alt="Human - Flavor Foley" class="album-cover">
            <h1>Human - Flavor Foley</h1>
            <audio id="music" controls>
                <source src="./songs/Human.mp3" type="audio/mpeg">
            </audio>

            <div class="controls">
                <button class="btn-player">Previous</button>
                <button id="pause" class="btn-player">Play</button>
                <button class="btn-player">Next</button>
            </div>
        </div>

        <div class="story">
            <h1 class="year">2026</h1>
            <p>Minha história é...</p>
        </div>
    </main>

    <footer>Desenvolvido por <a href="https://github.com/Bless-Developer" target="_blank" rel="noopener noreferrer">Cassandra Oliveira</a>. Musicas e obras pertencem aos seus respectivos criadores.</footer>


<script src="script.js"></script>
</body>
</html>
